<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミルコレ メンフィス案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #F2F2F0; --page-muted: #707070;
    /* Memphis tokens */
    --bg: #FFFDF6; --surface: #FFFFFF; --ink: #1A1A1A; --muted: #6B6B6B;
    --pink: #FF8FB1; --yellow: #FFD23F; --teal: #3DCCC7; --lilac: #B79CFF; --blue: #3A6FF7; --orange: #FF7A45;
    --accent: var(--yellow); --on-accent: var(--ink);
    --border: 2px solid var(--ink); --hard: 4px 4px 0 var(--ink);
    --font-head: "Dela Gothic One", sans-serif; --font: "M PLUS Rounded 1c", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page-bg); color: #222; font-family: var(--font); padding: 32px 16px 64px; }
  .page-head { max-width: 1200px; margin: 0 auto 28px; }
  .page-head h1 { font-size: 22px; font-weight: 800; }
  .page-head p { color: var(--page-muted); font-size: 14px; margin-top: 6px; line-height: 1.7; }
  .style-block { max-width: 1240px; margin: 0 auto; background: #fff; border-radius: 20px; padding: 24px; }
  .style-block h2 { font-family: var(--font-head); font-size: 22px; font-weight: 400; }
  .tag { font-size: 13px; color: var(--page-muted); margin-top: 4px; line-height: 1.7; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 20px; align-items: flex-start; }
  .notes { flex: 1 1 240px; min-width: 220px; font-size: 13px; line-height: 1.8; color: #333; }
  .notes h3 { font-size: 13px; margin: 14px 0 6px; color: var(--page-muted); font-weight: 500; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 26px; }
  .sw { width: 40px; height: 40px; border-radius: 10px; border: var(--border); position: relative; }
  .sw span { position: absolute; top: 42px; left: 0; font-size: 10px; color: var(--page-muted); white-space: nowrap; }

  .phone { width: 300px; height: 620px; border-radius: 38px; overflow: hidden; position: relative; box-shadow: 0 0 0 8px #1b1b1b; flex: 0 0 auto;
    background: var(--bg); color: var(--ink); font-family: var(--font); display: flex; flex-direction: column; }
  .status { height: 34px; flex: 0 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 12px; position: relative; z-index: 2; }
  .topbar h4 { font-family: var(--font-head); font-size: 20px; font-weight: 400; letter-spacing: .04em; }
  .topbar .ic { width: 24px; height: 24px; }
  .iconbtn { width: 36px; height: 36px; border: var(--border); border-radius: 50%; display: grid; place-items: center; background: var(--surface); }
  .iconbtn.ura { background: var(--lilac); }
  .iconbtn svg { width: 18px; height: 18px; }
  .screen { flex: 1; position: relative; overflow: hidden; }
  .nav { flex: 0 0 auto; display: flex; justify-content: space-around; padding: 10px 10px 22px; background: var(--surface); border-top: var(--border); }
  .nav div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; }
  .nav svg { width: 22px; height: 22px; }
  .nav .on svg { background: var(--pink); border: var(--border); border-radius: 12px; padding: 3px; width: 36px; height: 28px; }

  /* 装飾（背景の幾何学モチーフ。控えめに） */
  .deco { position: absolute; pointer-events: none; }

  /* つながり */
  .card { position: absolute; inset: 4px 20px 22px 16px; border-radius: 18px; background: var(--surface); border: var(--border); box-shadow: var(--hard); display: flex; flex-direction: column; overflow: hidden; z-index: 1; }
  .card .photo { flex: 1; position: relative; border-bottom: var(--border); }
  .card .photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card .label { position: absolute; top: 12px; left: 12px; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--teal); border: var(--border); letter-spacing: .06em; }
  .card .body { padding: 14px 16px 16px; }
  .card .q { font-family: var(--font-head); font-size: 17px; font-weight: 400; line-height: 1.4; }
  .rule { margin-top: 8px; font-size: 11.5px; line-height: 1.6; display: flex; gap: 6px; align-items: flex-start; }
  .rule mark { background: var(--yellow); padding: 0 3px; font-weight: 800; color: var(--ink); }
  .btns { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; text-align: center; padding: 10px 0; border-radius: 12px; font-size: 13px; font-weight: 800; border: var(--border); }
  .btn.primary { background: var(--accent); box-shadow: 3px 3px 0 var(--ink); }
  .btn.ghost { background: var(--surface); }

  .trace-under, .trace { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 4s cubic-bezier(.3,.7,.3,1) infinite; }
  .trace-under { stroke: #fff; stroke-width: 7; }
  .trace { stroke: var(--ink); stroke-width: 3; }
  @keyframes draw { 0% { stroke-dashoffset: 600; } 50%, 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }

  /* 収集 */
  .shape { position: absolute; z-index: 1; animation: wobble 2.6s steps(1) infinite; }
  .shape svg { width: 100%; height: 100%; overflow: visible; }
  .shape .offset { stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
  .shape .edge { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
  .shape .detail { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
  /* メンフィスらしく、なめらかに漂うのではなく「コマ送り」でカクッと揺れる */
  @keyframes wobble { 0% { transform: rotate(var(--r0)); } 50% { transform: rotate(var(--r1)) translateY(-4px); } }
  .shelf { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 18px 14px; display: flex; align-items: flex-end; gap: 12px; z-index: 1; }
  .shelf .cap { position: absolute; top: -20px; left: 18px; font-size: 11px; font-weight: 800; background: var(--yellow); border: var(--border); padding: 1px 8px; border-radius: 6px; }
  .bottle { width: 40px; height: 58px; overflow: visible; }
  .bottle path { stroke: var(--ink); stroke-width: 2; }
  .bottle.locked path { fill: none; stroke-dasharray: 4 3; stroke: var(--muted); }

  .ura-sample { position: relative; height: 72px; border-radius: 14px; border: var(--border); overflow: hidden; background: #2A1E5C; box-shadow: var(--hard); }
  .ura-sample b { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-family: var(--font-head); font-weight: 400; font-size: 16px; letter-spacing: .1em; }

  @media (max-width: 680px) { .phone { width: 100%; max-width: 320px; } .style-block { padding: 18px 16px; } }
</style>
</head>
<body>
  <div class="page-head">
    <h1>ミルコレ：メンフィス案</h1>
    <p>白ベースは保ったまま、黒の輪郭線・ずらした黒い影・はっきりした原色パステル・幾何学モチーフ（波線、三角、ドット、半円）。グラデーションなし。左：つながり／右：収集。</p>
  </div>

  <section class="style-block">
    <h2>G. メンフィス</h2>
    <div class="tag">遊び心があってポップ。色数は多いが、すべて単色＋黒線なので散らからない。「見立て」の遊びっぽさと相性がよい。</div>
    <div class="row" id="row"></div>
  </section>

<script>
const C = { pink: '#FF8FB1', yellow: '#FFD23F', teal: '#3DCCC7', lilac: '#B79CFF', blue: '#3A6FF7', orange: '#FF7A45', ink: '#1A1A1A' };

const skyPhoto = () => `<rect width="100" height="100" fill="#8CCBF2"/>
  <ellipse cx="30" cy="42" rx="20" ry="10" fill="#fff"/><ellipse cx="46" cy="34" rx="16" ry="12" fill="#fff"/>
  <ellipse cx="62" cy="44" rx="18" ry="9" fill="#fff"/><ellipse cx="78" cy="76" rx="14" ry="6" fill="#fff" opacity=".85"/>`;
const PHOTOS = {
  sky: skyPhoto,
  wall: () => `<rect width="100" height="100" fill="#C9BBA7"/><circle cx="30" cy="30" r="10" fill="#B3A38D"/><circle cx="72" cy="62" r="15" fill="#D8CCBB"/><circle cx="40" cy="78" r="6" fill="#B3A38D"/>`,
  wood: () => `<rect width="100" height="100" fill="#D79A62"/><rect y="22" width="100" height="8" fill="#C4864F"/><rect y="52" width="100" height="6" fill="#C4864F"/><rect y="78" width="100" height="9" fill="#C4864F"/>`,
};
const SHAPES = [
  { photo: 'sky', shadow: C.pink, path: 'M8,58 C14,38 38,30 58,36 C70,26 84,24 92,32 C86,38 82,42 80,48 C86,58 78,76 58,76 C38,82 16,74 8,58 Z', detail: 'M26,52 a2,2 0 1,0 0.1,0 M70,30 q4,-10 10,-12' },
  { photo: 'wall', shadow: C.teal, path: 'M50,8 C76,8 93,28 91,53 C89,79 70,94 48,92 C24,90 8,72 10,48 C12,24 27,8 50,8 Z', detail: 'M30,44 q6,4 12,0 M58,44 q6,4 12,0 M40,68 q10,6 20,0' },
  { photo: 'wood', shadow: C.yellow, path: 'M18,32 L25,8 L40,24 C46,22 54,22 60,24 L75,8 L82,32 C93,47 90,73 72,86 C58,96 40,96 26,86 C10,73 7,47 18,32 Z', detail: 'M34,50 a3,3 0 1,0 0.1,0 M64,50 a3,3 0 1,0 0.1,0 M46,62 l4,4 l4,-4' },
];

// 幾何学モチーフ
const squiggle = (x, y, w, color, rot = 0) => `<svg class="deco" style="left:${x}px;top:${y}px;width:${w}px;height:${w * .3}px;transform:rotate(${rot}deg)" viewBox="0 0 100 30"><path d="M3,15 q10,-14 20,0 t20,0 t20,0 t20,0 t14,0" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"/></svg>`;
const tri = (x, y, s, color, rot = 0) => `<svg class="deco" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;transform:rotate(${rot}deg)" viewBox="0 0 40 40"><path d="M20,4 L37,35 L3,35 Z" fill="${color}" stroke="${C.ink}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const dots = (x, y, cols, rows, color) => `<svg class="deco" style="left:${x}px;top:${y}px;width:${cols * 10}px;height:${rows * 10}px" viewBox="0 0 ${cols * 10} ${rows * 10}">${Array.from({ length: cols * rows }, (_, i) => `<circle cx="${(i % cols) * 10 + 5}" cy="${Math.floor(i / cols) * 10 + 5}" r="2" fill="${color}"/>`).join('')}</svg>`;
const half = (x, y, s, color, rot = 0) => `<svg class="deco" style="left:${x}px;top:${y}px;width:${s}px;height:${s / 2}px;transform:rotate(${rot}deg)" viewBox="0 0 40 20"><path d="M2,19 a18,18 0 0 1 36,0 Z" fill="${color}" stroke="${C.ink}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const ring = (x, y, s, color) => `<svg class="deco" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="${color}" stroke-width="6"/></svg>`;

const icon = {
  record: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
  collect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v5.5L5.5 17A3 3 0 0 0 8.2 21h7.6a3 3 0 0 0 2.7-4L14 7.5V2"/><path d="M8.5 2h7"/><path d="M7 15h10"/></svg>',
  connect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h9"/></svg>',
  sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>',
  pencil: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;margin-top:2px"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
};
const nav = (on) => `<div class="nav">
  <div class="${on==='record'?'on':''}">${icon.record}記録</div>
  <div class="${on==='collect'?'on':''}">${icon.collect}収集</div>
  <div class="${on==='connect'?'on':''}">${icon.connect}つながり</div></div>`;

const connectPhone = `<div class="phone"><div class="status"></div>
  <div class="topbar"><div class="iconbtn">${icon.menu}</div><h4>つながり</h4><div class="iconbtn ura">${icon.sparkle}</div></div>
  <div class="screen">
    ${tri(250, 380, 26, C.pink, 15)}${squiggle(-10, 440, 70, C.blue, -8)}
    <div class="card">
      <div class="photo"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">${skyPhoto()}
        <path class="trace-under" pathLength="600" d="${SHAPES[0].path}" transform="translate(0,4)"/>
        <path class="trace" pathLength="600" d="${SHAPES[0].path}" transform="translate(0,4)"/></svg>
        <div class="label">今月のお題</div></div>
      <div class="body">
        <div class="q">あなたには<br>何に見えますか？</div>
        <div class="rule">${icon.pencil}<span><mark>先に描く、それから見る。</mark>描き終えると、ほかの人の見え方がひらきます。</span></div>
        <div class="btns"><div class="btn ghost">スキップ</div><div class="btn primary">なぞってみる</div></div>
      </div>
    </div>
  </div>${nav('connect')}</div>`;

const pos = [
  { l: 24, t: 20, s: 118, r0: '-6deg', r1: '-1deg' },
  { l: 154, t: 118, s: 106, r0: '5deg', r1: '0deg' },
  { l: 42, t: 216, s: 110, r0: '-3deg', r1: '4deg' },
];
const shapes = SHAPES.map((s, i) => { const q = pos[i];
  return `<div class="shape" style="left:${q.l}px;top:${q.t}px;width:${q.s}px;height:${q.s}px;--r0:${q.r0};--r1:${q.r1};animation-delay:-${i * .8}s">
    <svg viewBox="0 0 100 100"><defs><clipPath id="m${i}"><path d="${s.path}"/></clipPath></defs>
      <path class="offset" d="${s.path}" fill="${s.shadow}" transform="translate(5,6)"/>
      <g clip-path="url(#m${i})">${PHOTOS[s.photo]()}</g>
      <path class="edge" d="${s.path}"/><path class="detail" d="${s.detail}"/></svg></div>`; }).join('');
const bottlePath = 'M15,2 h10 v10 c8,4 12,10 12,20 v18 a6,6 0 0 1 -6,6 h-22 a6,6 0 0 1 -6,-6 v-18 c0,-10 4,-16 12,-20 z';
const bottle = (fill, locked) => `<svg class="bottle ${locked ? 'locked' : ''}" viewBox="0 0 40 58"><path d="${bottlePath}" fill="${fill}"/></svg>`;

const collectPhone = `<div class="phone"><div class="status"></div>
  <div class="topbar"><div class="iconbtn">${icon.menu}</div><h4>収集</h4><span style="width:36px"></span></div>
  <div class="screen">
    ${dots(190, 20, 5, 4, C.ink)}${ring(222, 300, 40, C.teal)}${half(12, 150, 46, C.lilac, -20)}${squiggle(150, 250, 80, C.pink, 10)}${tri(130, 70, 22, C.yellow, -12)}
    ${shapes}
    <div class="shelf"><span class="cap">コレクション</span>${bottle(C.teal)}${bottle('', 1)}${bottle('', 1)}${bottle('', 1)}</div>
  </div>${nav('collect')}</div>`;

const notes = `<div class="notes">
  <h3>配色（すべて単色）</h3>
  <div class="swatches">${[['#FFFDF6','地'],[C.ink,'線'],[C.yellow,'イエロー'],[C.pink,'ピンク'],[C.teal,'ティール'],[C.lilac,'ライラック'],[C.blue,'ブルー']].map(([c,n]) => `<div class="sw" style="background:${c}"><span>${n}</span></div>`).join('')}</div>
  <h3>フォント</h3><div>見出し：Dela Gothic One（太くてクセのある見出し体）／本文：M PLUS Rounded 1c</div>
  <h3>形・部品</h3><div>黒の 2px 輪郭線、ぼかさない黒いずらし影、角丸 12–18px。背景に波線・三角・ドット・半円・リングを少しだけ散らす。</div>
  <h3>動き</h3><div>なめらかに漂うのではなく、コマ送りで「カクッ」と揺れる。ボタンは押すと影の分だけ沈む。</div>
  <h3>裏世界との対比</h3>
  <div class="ura-sample">
    ${squiggle(10, 8, 70, C.teal, -6)}${tri(220, 30, 24, C.pink, 20)}${dots(120, 40, 6, 2, '#fff')}${ring(170, 4, 30, C.lilac)}${half(70, 44, 36, C.yellow, 0)}
    <b>裏世界</b>
  </div>
  <div style="margin-top:8px;color:#707070;font-size:12px">地を濃紺に反転させ、同じモチーフを発光色で。グラデーションは使わない。</div>
</div>`;

document.getElementById('row').innerHTML = connectPhone + collectPhone + notes;
</script>
</body>
</html>
