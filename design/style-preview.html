<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミルコレ スタイル比較</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #ECEBE8;
    --page-ink: #222;
    --page-muted: #6b6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page-bg);
    color: var(--page-ink);
    font-family: "Noto Sans JP", system-ui, sans-serif;
    padding: 32px 16px 64px;
  }
  .page-head { max-width: 1200px; margin: 0 auto 28px; }
  .page-head h1 { font-size: 22px; font-weight: 700; }
  .page-head p { color: var(--page-muted); font-size: 14px; margin-top: 6px; line-height: 1.7; }

  .styles { max-width: 1240px; margin: 0 auto; display: grid; gap: 40px; }
  .style-block { background: #fff; border-radius: 20px; padding: 24px; }
  .style-block header h2 { font-size: 20px; }
  .style-block header .tag { font-size: 13px; color: var(--page-muted); margin-top: 4px; line-height: 1.7; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 20px; align-items: flex-start; }
  .notes { flex: 1 1 240px; min-width: 220px; font-size: 13px; line-height: 1.8; color: #333; }
  .notes h3 { font-size: 13px; margin: 14px 0 6px; color: var(--page-muted); font-weight: 500; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .sw { width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(0,0,0,.08); position: relative; }
  .sw span { position: absolute; top: 48px; left: 0; font-size: 10px; color: var(--page-muted); white-space: nowrap; }
  .swatches { margin-bottom: 26px; }
  .ura { height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; letter-spacing: .1em; }

  /* ---------- phone ---------- */
  .phone {
    width: 300px; height: 620px; border-radius: 38px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 8px #1b1b1b, 0 18px 40px rgba(0,0,0,.25);
    background: var(--bg); color: var(--ink); font-family: var(--font-body);
    display: flex; flex-direction: column; flex: 0 0 auto;
  }
  .status { height: 34px; flex: 0 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 10px; }
  .topbar h4 { font-family: var(--font-head); font-size: 20px; font-weight: 700; letter-spacing: .04em; }
  .topbar .ic { width: 22px; height: 22px; color: var(--ink); opacity: .8; }
  .screen { flex: 1; position: relative; overflow: hidden; }
  .nav {
    flex: 0 0 auto; display: flex; justify-content: space-around; padding: 10px 8px 22px;
    background: var(--nav-bg); border-top: var(--nav-border);
  }
  .nav div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); }
  .nav div.on { color: var(--accent); }
  .nav svg { width: 22px; height: 22px; }

  /* つながり card */
  .card {
    position: absolute; inset: 4px 16px 14px; border-radius: var(--card-radius);
    overflow: hidden; background: var(--surface); box-shadow: var(--card-shadow);
    display: flex; flex-direction: column;
  }
  .card .photo { flex: 1; position: relative; }
  .card .photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card .label {
    position: absolute; top: 12px; left: 12px; font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: var(--chip-bg); color: var(--chip-ink); letter-spacing: .06em; backdrop-filter: blur(8px);
  }
  .card .body { padding: 14px 16px 16px; }
  .card .q { font-family: var(--font-head); font-size: 18px; font-weight: 700; }
  .card .rule { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.6; display: flex; gap: 6px; align-items: flex-start; }
  .card .rule svg { width: 14px; height: 14px; flex: 0 0 auto; margin-top: 2px; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; text-align: center; padding: 11px 0; border-radius: var(--btn-radius); font-size: 13px; font-weight: 700; }
  .btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--btn-glow); }
  .btn.ghost { border: 1px solid var(--line-soft); color: var(--muted); font-weight: 500; }

  .trace { fill: none; stroke: var(--trace); stroke-width: var(--trace-w); stroke-linecap: round; stroke-linejoin: round;
    filter: var(--trace-filter); stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw var(--draw-dur) var(--ease) infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 600; } 55%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }

  /* 収集 */
  .shapes { position: absolute; inset: 0; }
  .shape { position: absolute; animation: float var(--float-dur) var(--float-ease) infinite alternate; }
  .shape svg { width: 100%; height: 100%; overflow: visible; filter: var(--shape-shadow); }
  .shape .outline { fill: none; stroke: var(--shape-edge); stroke-width: var(--shape-edge-w); filter: var(--trace-filter); }
  .shape .detail { fill: none; stroke: var(--detail); stroke-width: 2.4; stroke-linecap: round; }
  @keyframes float {
    from { transform: translate(0, 0) rotate(var(--r0)); }
    to { transform: translate(var(--dx), var(--dy)) rotate(var(--r1)); }
  }
  .shelf {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 18px 10px;
    display: flex; align-items: flex-end; gap: 14px; border-top: 1px dashed var(--line-soft);
  }
  .shelf .cap { font-size: 11px; color: var(--muted); position: absolute; top: -20px; left: 18px; letter-spacing: .08em; }
  .bottle { width: 40px; height: 58px; }
  .bottle path { fill: var(--glass); stroke: var(--glass-edge); stroke-width: 1.5; }
  .bottle.locked path { fill: var(--silhouette); stroke: none; }

  /* ---------- Theme A: 紙と鉛筆 ---------- */
  .A {
    --bg: #F6F2EA; --surface: #FFFDF8; --ink: #1F1D1A; --muted: #8A8378; --accent: #E0533A; --on-accent: #FFFDF8;
    --line-soft: #D9D1C3; --nav-bg: #F6F2EA; --nav-border: 1px solid #E3DCCF;
    --font-head: "Zen Old Mincho", serif; --font-body: "Zen Kaku Gothic New", sans-serif;
    --card-radius: 6px; --card-shadow: 0 1px 0 #E3DCCF, 0 8px 24px rgba(60,40,10,.07);
    --chip-bg: rgba(255,253,248,.9); --chip-ink: #1F1D1A; --btn-radius: 4px; --btn-glow: none;
    --trace: #1F1D1A; --trace-w: 2.6; --trace-filter: none; --draw-dur: 5.5s; --ease: cubic-bezier(.45,.05,.35,1);
    --shape-shadow: drop-shadow(0 6px 10px rgba(60,40,10,.12)); --shape-edge: #1F1D1A; --shape-edge-w: 1.6; --detail: #1F1D1A;
    --float-dur: 7s; --float-ease: ease-in-out;
    --glass: rgba(255,255,255,.6); --glass-edge: #1F1D1A; --silhouette: #E3DCCF;
  }
  .A .phone { background-image: radial-gradient(rgba(120,100,70,.06) 1px, transparent 1px); background-size: 4px 4px; }

  /* ---------- Theme B: 空とガラス ---------- */
  .B {
    --bg: linear-gradient(170deg, #CFE6FB 0%, #E9E4FA 50%, #FBE3D6 100%);
    --surface: rgba(255,255,255,.55); --ink: #2B2D42; --muted: #6E7191; --accent: #8B7CF6; --on-accent: #fff;
    --line-soft: rgba(43,45,66,.18); --nav-bg: rgba(255,255,255,.55); --nav-border: none;
    --font-head: "Zen Maru Gothic", sans-serif; --font-body: "Zen Maru Gothic", sans-serif;
    --card-radius: 28px; --card-shadow: 0 10px 30px rgba(110,100,200,.18), inset 0 0 0 1px rgba(255,255,255,.7);
    --chip-bg: rgba(255,255,255,.6); --chip-ink: #2B2D42; --btn-radius: 999px; --btn-glow: 0 6px 16px rgba(139,124,246,.35);
    --trace: #fff; --trace-w: 4; --trace-filter: drop-shadow(0 0 3px rgba(139,124,246,.9)); --draw-dur: 4s; --ease: cubic-bezier(.34,1.56,.64,1);
    --shape-shadow: drop-shadow(0 10px 14px rgba(110,100,200,.25)); --shape-edge: rgba(255,255,255,.95); --shape-edge-w: 3; --detail: #fff;
    --float-dur: 3.6s; --float-ease: cubic-bezier(.34,1.56,.64,1);
    --glass: rgba(255,255,255,.45); --glass-edge: rgba(255,255,255,.95); --silhouette: rgba(43,45,66,.10);
  }
  .B .phone { background: var(--bg); }
  .B .card { backdrop-filter: blur(14px); }
  .B .nav { margin: 0 14px 14px; border-radius: 26px; padding: 10px 8px 10px; backdrop-filter: blur(14px); box-shadow: 0 6px 20px rgba(110,100,200,.15); }

  /* ---------- Theme C: 夜の観察室 ---------- */
  .C {
    --bg: #11141B; --surface: #1A1F2A; --ink: #E8EAF0; --muted: #8A91A3; --accent: #F2C46D; --on-accent: #11141B;
    --line-soft: #2C3342; --nav-bg: #0D1016; --nav-border: 1px solid #1F2430;
    --font-head: "Space Grotesk", "Noto Sans JP", sans-serif; --font-body: "Noto Sans JP", sans-serif;
    --card-radius: 18px; --card-shadow: 0 0 0 1px #242a37, 0 20px 40px rgba(0,0,0,.4);
    --chip-bg: rgba(17,20,27,.6); --chip-ink: #E8EAF0; --btn-radius: 12px; --btn-glow: 0 0 18px rgba(242,196,109,.35);
    --trace: #8FF0D2; --trace-w: 2.6; --trace-filter: drop-shadow(0 0 4px #8FF0D2) drop-shadow(0 0 10px rgba(143,240,210,.5)); --draw-dur: 5s; --ease: cubic-bezier(.6,0,.2,1);
    --shape-shadow: drop-shadow(0 0 14px rgba(143,240,210,.18)); --shape-edge: #8FF0D2; --shape-edge-w: 1.8; --detail: #FFD1E8;
    --float-dur: 9s; --float-ease: ease-in-out;
    --glass: rgba(143,240,210,.08); --glass-edge: rgba(143,240,210,.7); --silhouette: #1F2430;
  }
  .C .card .q { font-size: 16.5px; }

  @media (max-width: 680px) {
    .phone { width: 100%; max-width: 320px; }
    .style-block { padding: 18px 16px; }
  }
</style>
</head>
<body>
  <div class="page-head">
    <h1>ミルコレ：視覚スタイル 3 案</h1>
    <p>各案とも、左：つながり（「先に描く、それから見る」のカード）／右：収集（形が浮かぶ画面）。写真はすべて仮のプレースホルダーです。線が描かれるアニメーションと、形のゆれ方で動きの性格を見てください。</p>
  </div>
  <div class="styles" id="styles"></div>

<script>
const STYLES = [
  { id: 'A', name: 'A. 紙と鉛筆', tag: '静か・手づくり感。観察手帳のような余白。SNS の騒がしさから一番遠い。',
    colors: [['#F6F2EA','紙'],['#1F1D1A','墨'],['#E0533A','朱'],['#8A8378','灰']],
    fonts: '見出し：Zen Old Mincho（明朝）／本文：Zen Kaku Gothic New',
    motion: 'ゆっくり、控えめ。筆跡がにじむように現れ、弾まない。',
    aurora: 'linear-gradient(120deg,#2b3a67,#4f7f86,#9bbf9a,#c9a3c4)' },
  { id: 'B', name: 'B. 空とガラス', tag: '柔らかい・癒し。空を見上げた原体験とガラス瓶に直結。親しみやすさは最大、ありがちな癒し系に寄るリスクあり。',
    colors: [['#CFE6FB','空'],['#FBE3D6','夕'],['#8B7CF6','ラベンダー'],['#2B2D42','文字']],
    fonts: 'Zen Maru Gothic（丸ゴシック）',
    motion: 'ふわっと浮いて、少し弾む。泡のような反応。',
    aurora: 'linear-gradient(120deg,#5b4bd6,#3fb6c8,#8de3b0,#f4a6d7)' },
  { id: 'C', name: 'C. 夜の観察室', tag: '落ち着き・洗練。寝る前のスマホ時間に合う。裏世界のオーロラや虹の縁取りが一番映える。昼の外出感は弱め。',
    colors: [['#11141B','夜'],['#1A1F2A','面'],['#8FF0D2','ミント光'],['#F2C46D','金']],
    fonts: '見出し：Space Grotesk + Noto Sans JP／本文：Noto Sans JP',
    motion: 'なめらか。線に光の尾、切替はフェード＋わずかなぼかし。',
    aurora: 'linear-gradient(120deg,#0b1f3a,#145c6b,#3fd3a5,#7b5cff,#e86fd0)' },
];

// placeholder "photos" (same for every style — a photo is a photo)
const photoDefs = (p) => `
  <linearGradient id="${p}sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FA8DC"/><stop offset="1" stop-color="#CFE3F3"/></linearGradient>
  <radialGradient id="${p}cloud"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="${p}wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9A894"/><stop offset=".5" stop-color="#9C8B76"/><stop offset="1" stop-color="#C7B8A3"/></linearGradient>
  <linearGradient id="${p}wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A86F44"/><stop offset=".3" stop-color="#C58A57"/><stop offset=".6" stop-color="#9A6038"/><stop offset="1" stop-color="#C48B5C"/></linearGradient>`;

const skyPhoto = (p) => `
  <rect width="100" height="100" fill="url(#${p}sky)"/>
  <ellipse cx="30" cy="40" rx="22" ry="12" fill="url(#${p}cloud)"/>
  <ellipse cx="48" cy="34" rx="18" ry="14" fill="url(#${p}cloud)"/>
  <ellipse cx="62" cy="44" rx="20" ry="11" fill="url(#${p}cloud)"/>
  <ellipse cx="75" cy="72" rx="16" ry="8" fill="url(#${p}cloud)" opacity=".7"/>`;

const SHAPES = [
  { photo: 'sky', name: 'くじら', path: 'M8,58 C14,38 38,30 58,36 C70,26 84,24 92,32 C86,38 82,42 80,48 C86,58 78,76 58,76 C38,82 16,74 8,58 Z', detail: 'M26,52 a2,2 0 1,0 0.1,0 M70,30 q4,-10 10,-12' },
  { photo: 'wall', name: 'ねむいかお', path: 'M50,8 C76,8 93,28 91,53 C89,79 70,94 48,92 C24,90 8,72 10,48 C12,24 27,8 50,8 Z', detail: 'M30,44 q6,4 12,0 M58,44 q6,4 12,0 M40,68 q10,6 20,0' },
  { photo: 'wood', name: 'ねこ', path: 'M18,32 L25,8 L40,24 C46,22 54,22 60,24 L75,8 L82,32 C93,47 90,73 72,86 C58,96 40,96 26,86 C10,73 7,47 18,32 Z', detail: 'M34,50 a3,3 0 1,0 0.1,0 M64,50 a3,3 0 1,0 0.1,0 M46,62 l4,4 l4,-4' },
];
const photoFill = (p, kind) => kind === 'sky' ? skyPhoto(p)
  : kind === 'wall' ? `<rect width="100" height="100" fill="url(#${p}wall)"/><circle cx="30" cy="30" r="9" fill="#8a7a66" opacity=".5"/><circle cx="70" cy="60" r="14" fill="#d8cbb8" opacity=".5"/>`
  : `<rect width="100" height="100" fill="url(#${p}wood)"/><path d="M0,30 Q50,20 100,34 M0,60 Q50,52 100,66 M0,82 Q50,76 100,88" stroke="#7d4a28" stroke-width="1.2" fill="none" opacity=".5"/>`;

const icon = {
  record: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
  collect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v5.5L5.5 17A3 3 0 0 0 8.2 21h7.6a3 3 0 0 0 2.7-4L14 7.5V2"/><path d="M8.5 2h7"/><path d="M7 15h10"/></svg>',
  connect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  menu: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
  sparkle: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
};

const nav = (on) => `<div class="nav">
  <div class="${on==='record'?'on':''}">${icon.record}記録</div>
  <div class="${on==='collect'?'on':''}">${icon.collect}収集</div>
  <div class="${on==='connect'?'on':''}">${icon.connect}つながり</div></div>`;

function connectPhone(id) {
  const p = id + 'c';
  return `<div class="phone"><div class="status"></div>
    <div class="topbar">${icon.menu}<h4>つながり</h4>${icon.sparkle}</div>
    <div class="screen"><div class="card">
      <div class="photo">
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs>${photoDefs(p)}</defs>${skyPhoto(p)}
          <path class="trace" pathLength="600" d="${SHAPES[0].path}" transform="translate(0,4)"/></svg>
        <div class="label">今月のお題</div>
      </div>
      <div class="body">
        <div class="q">あなたには何に見えますか？</div>
        <div class="rule">${icon.pencil}<span>先に描く、それから見る。描き終えると、ほかの人の見え方がひらきます。</span></div>
        <div class="btns"><div class="btn ghost">スキップ</div><div class="btn primary">なぞってみる</div></div>
      </div>
    </div></div>${nav('connect')}</div>`;
}

function collectPhone(id) {
  const pos = [
    { l: 22, t: 30, s: 120, r0: '-6deg', r1: '4deg', dx: '10px', dy: '-12px', d: '0s' },
    { l: 150, t: 120, s: 110, r0: '5deg', r1: '-5deg', dx: '-8px', dy: '10px', d: '-1.5s' },
    { l: 40, t: 220, s: 112, r0: '-3deg', r1: '7deg', dx: '12px', dy: '6px', d: '-3s' },
  ];
  const shapes = SHAPES.map((s, i) => {
    const p = `${id}s${i}`, q = pos[i];
    return `<div class="shape" style="left:${q.l}px;top:${q.t}px;width:${q.s}px;height:${q.s}px;--r0:${q.r0};--r1:${q.r1};--dx:${q.dx};--dy:${q.dy};animation-delay:${q.d}">
      <svg viewBox="0 0 100 100"><defs>${photoDefs(p)}<clipPath id="${p}clip"><path d="${s.path}"/></clipPath></defs>
        <g clip-path="url(#${p}clip)">${photoFill(p, s.photo)}</g>
        <path class="outline" d="${s.path}"/><path class="detail" d="${s.detail}"/></svg></div>`;
  }).join('');
  const bottle = (locked) => `<svg class="bottle ${locked ? 'locked' : ''}" viewBox="0 0 40 58"><path d="M15,2 h10 v10 c8,4 12,10 12,20 v18 a6,6 0 0 1 -6,6 h-22 a6,6 0 0 1 -6,-6 v-18 c0,-10 4,-16 12,-20 z"/></svg>`;
  return `<div class="phone"><div class="status"></div>
    <div class="topbar">${icon.menu}<h4>収集</h4><span style="width:22px"></span></div>
    <div class="screen"><div class="shapes">${shapes}</div>
      <div class="shelf"><span class="cap">コレクション</span>${bottle(false)}${bottle(true)}${bottle(true)}${bottle(true)}</div>
    </div>${nav('collect')}</div>`;
}

document.getElementById('styles').innerHTML = STYLES.map(s => `
  <section class="style-block ${s.id}">
    <header><h2>${s.name}</h2><div class="tag">${s.tag}</div></header>
    <div class="row">
      ${connectPhone(s.id)}
      ${collectPhone(s.id)}
      <div class="notes">
        <h3>配色</h3>
        <div class="swatches">${s.colors.map(([c, n]) => `<div class="sw" style="background:${c}"><span>${n}</span></div>`).join('')}</div>
        <h3>フォント</h3><div>${s.fonts}</div>
        <h3>動き</h3><div>${s.motion}</div>
        <h3>裏世界（オーロラ）との対比</h3>
        <div class="ura" style="background:${s.aurora}">裏世界</div>
      </div>
    </div>
  </section>`).join('');
</script>
</body>
</html>
